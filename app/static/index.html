<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#101d2c" />
  <title>BuildWise AI | Construction Intelligence</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root{--navy:#101d2c;--navy2:#172a3f;--paper:#f4f7fb;--ink:#1e293b;--muted:#64748b;--line:#e2e8f0;--orange:#f59e0b;--teal:#0f766e}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
    aside{background:var(--navy);color:#dbe5f0;padding:26px 17px;display:flex;flex-direction:column;gap:28px}
    .brand{display:flex;align-items:center;gap:11px;padding:0 8px}.brandmark{width:38px;height:38px;border-radius:12px;background:var(--orange);display:grid;place-items:center;color:#172033;font-size:21px;font-weight:900}
    .brand strong{display:block;color:white;font-size:16px;letter-spacing:.2px}.brand small{display:block;color:#9aafc4;font-size:11px;margin-top:3px}
    .navlabel{font-size:10px;color:#8298af;text-transform:uppercase;letter-spacing:1.4px;padding:0 12px;margin-bottom:8px}
    .nav{display:flex;flex-direction:column;gap:5px}.nav button{border:0;background:transparent;color:#b7c5d5;text-align:left;padding:12px;border-radius:10px;display:flex;align-items:center;gap:12px;font-size:13px}
    .nav button.active,.nav button:hover{background:#243950;color:white}.nav .ico{width:20px;text-align:center;font-size:16px}.sidefoot{margin-top:auto;border-top:1px solid #2b4055;padding:16px 8px;color:#94a9bd;font-size:11px;line-height:1.6}
    main{min-width:0}.topbar{height:74px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;gap:20px}
    .crumb{font-size:12px;color:var(--muted)}.crumb b{color:var(--ink)}.profile{display:flex;align-items:center;gap:10px;font-size:12px;color:#475569}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#e2e8f0;color:#334155;font-weight:800}
    .content{max-width:1240px;margin:auto;padding:30px 34px 48px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.5px;color:var(--teal);text-transform:uppercase}
    h1{font-size:clamp(26px,3vw,36px);letter-spacing:-1px;margin:8px 0 10px;color:#142336}.intro{color:var(--muted);font-size:14px;line-height:1.7;max-width:760px;margin:0}
    .hero{background:linear-gradient(120deg,#172a3f,#23425b);border-radius:18px;padding:26px 28px;color:white;display:flex;justify-content:space-between;align-items:center;gap:20px;margin:24px 0}
    .hero h2{font-size:20px;margin:0 0 8px}.hero p{margin:0;color:#c5d3e0;font-size:13px;line-height:1.6;max-width:630px}.heroBadge{white-space:nowrap;border:1px solid #557087;border-radius:30px;padding:9px 13px;font-size:11px;color:#e3edf7}
    .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin-bottom:26px}.stat,.panel,.feature{background:white;border:1px solid var(--line);border-radius:14px;padding:18px}
    .stathead{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}.statnum{font-size:25px;font-weight:800;margin-top:12px;color:#142336}.statnote{font-size:11px;color:#64748b;margin-top:4px}
    .sectionhead{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:27px 0 14px}.sectionhead h2{font-size:18px;margin:0}.sectionhead p{font-size:12px;color:var(--muted);margin:5px 0 0}
    .features{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.feature{padding:18px;text-align:left;transition:transform .15s,border-color .15s;display:flex;flex-direction:column;gap:10px;color:inherit;min-height:158px}
    .feature:hover,.feature.selected{border-color:#0f766e;transform:translateY(-2px);box-shadow:0 7px 20px #0f766e0d}.feature.selected{background:#f0fdfa}
    .featureIcon{width:38px;height:38px;border-radius:11px;background:#e9f5f3;display:grid;place-items:center;font-size:18px}.feature h3{margin:0;font-size:14px}.feature p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}
    .workgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(300px,.9fr);gap:16px;align-items:start}.panel h3{margin:0 0 6px;font-size:16px}.sub{font-size:12px;color:var(--muted);line-height:1.5;margin:0 0 18px}
    label{font-size:12px;font-weight:700;display:block;margin:14px 0 7px;color:#334155}.hint{font-weight:400;color:#94a3b8}
    textarea,input,select{width:100%;border:1px solid #d8e1eb;border-radius:9px;padding:11px 12px;background:#fff;color:#1e293b;outline:none;font-size:13px}
    textarea{min-height:110px;resize:vertical;line-height:1.55}input:focus,textarea:focus,select:focus{border-color:#0f766e;box-shadow:0 0 0 3px #0f766e12}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.filebox{border:1px dashed #cbd5e1;border-radius:10px;padding:13px;background:#f8fafc}
    .filebox input{border:0;padding:5px 0;background:transparent}.btn{border:0;background:var(--teal);color:white;padding:12px 16px;border-radius:9px;font-size:13px;font-weight:750;width:100%;margin-top:16px}.btn:hover{background:#115e59}.btn:disabled{opacity:.6;cursor:wait}
    .btn.secondary{background:#e8eef5;color:#334155;margin-top:9px}.btn.secondary:hover{background:#dce6f0}
    .resultEmpty{border:1px dashed #cbd5e1;border-radius:12px;padding:32px 22px;text-align:center;color:var(--muted);background:#fbfdff}.resultEmpty .big{font-size:28px;margin-bottom:10px}.resultEmpty p{font-size:12px;line-height:1.6;margin:7px auto;max-width:300px}
    .resultTitle{display:flex;justify-content:space-between;gap:12px;align-items:start}.resultTitle h3{font-size:17px;line-height:1.4;margin:0}.risk{font-size:10px;font-weight:800;border-radius:30px;padding:6px 9px;background:#e2e8f0;color:#475569;white-space:nowrap}
    .risk.high{background:#fee2e2;color:#991b1b}.risk.medium{background:#fef3c7;color:#92400e}.risk.low{background:#dcfce7;color:#166534}
    .summary{font-size:13px;line-height:1.7;color:#475569;margin:15px 0}.resultsection{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.resultsection h4{font-size:12px;margin:0 0 8px}.resultsection ul{margin:0;padding-left:18px;color:#475569;font-size:12px;line-height:1.7}.resultsection li{margin:5px 0}
    .notice{font-size:11px;line-height:1.6;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:10px;padding:11px 12px;margin-top:16px}.error{color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;padding:11px;border-radius:9px;font-size:12px;margin-top:12px}
    .weatherbox{background:#f8fafc;border:1px solid var(--line);padding:14px;border-radius:10px;font-size:12px;line-height:1.7;color:#475569}.weatherbox strong{color:#1e293b}
    footer{color:#94a3b8;font-size:11px;text-align:center;margin-top:30px}
    @media(max-width:1000px){.shell{grid-template-columns:210px minmax(0,1fr)}.content{padding:25px 22px}.topbar{padding:0 22px}.features{grid-template-columns:repeat(2,minmax(0,1fr))}.workgrid{grid-template-columns:1fr}}
    @media(max-width:680px){.shell{grid-template-columns:1fr}aside{padding:12px;gap:12px}.brand{padding:3px}.navlabel,.sidefoot{display:none}.nav{display:grid;grid-template-columns:repeat(3,1fr)}.nav button{justify-content:center;padding:9px 5px;font-size:11px;gap:5px;flex-direction:column}.nav .ico{font-size:17px}.topbar{height:58px;padding:0 15px}.content{padding:22px 14px}.hero{padding:20px;align-items:start;flex-direction:column}.stats{gap:8px}.stat{padding:12px}.statnum{font-size:20px}.statnote{font-size:10px}.features{gap:9px}.feature{padding:13px;min-height:160px}.two{grid-template-columns:1fr}.profile span{display:none}}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect} = React;
const FEATURES = [
  {id:"safety", icon:"⛑", title:"Site Safety Review", desc:"Review visible site hazards, PPE, access and housekeeping.", prompt:"Review this construction site for visible safety concerns. List observations and practical checks."},
  {id:"cracks", icon:"⌁", title:"Crack & Surface Review", desc:"Describe visible cracks and identify sensible follow-up checks.", prompt:"Review the uploaded construction image for visible cracks or surface defects."},
  {id:"valuation", icon:"⌂", title:"Real Estate Valuation", desc:"Calculate an indicative estimate from property details you provide.", prompt:"Estimate the property value using the details below. Do not invent local market rates."},
  {id:"planning", icon:"▦", title:"Project Planning", desc:"Create phases, dependencies, quality gates and a risk checklist.", prompt:"Create a preliminary construction plan. State assumptions and list the major phases in order."},
  {id:"assistant", icon:"✦", title:"Construction AI Assistant", desc:"Ask practical questions about construction methods and materials.", prompt:"Answer my construction-related question in clear, practical steps."},
  {id:"weather", icon:"☁", title:"Weather-Aware Advisory", desc:"Fetch a forecast and turn it into cautious site-planning guidance.", prompt:"Use the weather details and site activity below to suggest practical precautions."}
];
function App(){
  const [feature,setFeature]=useState("safety");
  const [prompt,setPrompt]=useState(FEATURES[0].prompt);
  const [project,setProject]=useState({location:"",activity:"",area:"",unit:"sq ft",pricePerUnit:"",budget:"",duration:"",materials:"",notes:""});
  const [image,setImage]=useState(null);
  const [result,setResult]=useState(null);
  const [error,setError]=useState("");
  const [busy,setBusy]=useState(false);
  const [health,setHealth]=useState(null);
  const [weather,setWeather]=useState(null);
  const [coords,setCoords]=useState({latitude:"22.7196",longitude:"75.8577"});
  useEffect(()=>{fetch("/api/health").then(r=>r.json()).then(setHealth).catch(()=>setHealth(null));},[]);
  function chooseFeature(id){setFeature(id);setPrompt(FEATURES.find(f=>f.id===id).prompt);setResult(null);setError("");}
  function update(key,value){setProject(p=>({...p,[key]:value}));}
  async function getWeather(){
    setError("");setWeather(null);setBusy(true);
    try{
      const r=await fetch("/api/weather",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({latitude:Number(coords.latitude),longitude:Number(coords.longitude)})});
      const d=await r.json();if(!r.ok)throw new Error(d.detail||"Could not load weather");
      setWeather(d.data);
    }catch(e){setError(e.message)}finally{setBusy(false)}
  }
  async function runAnalysis(e){
    e.preventDefault();setBusy(true);setError("");setResult(null);
    try{
      const fd=new FormData();fd.append("feature",feature);fd.append("prompt",prompt);
      const structured={...project};
      if(feature==="weather" && weather) structured.weather_forecast=weather;
      Object.keys(structured).forEach(k=>{if(structured[k]==="")delete structured[k]});
      fd.append("project_data",JSON.stringify(structured));
      if(image)fd.append("image",image);
      const r=await fetch("/api/analyze",{method:"POST",body:fd});const d=await r.json();
      if(!r.ok)throw new Error(d.detail||"Analysis failed");setResult(d);
    }catch(e){setError(e.message||"Something went wrong.")}finally{setBusy(false)}
  }
  const selected=FEATURES.find(f=>f.id===feature);
  const riskClass=result ? (String(result.risk_level).toLowerCase().includes("high")?"high":String(result.risk_level).toLowerCase().includes("medium")?"medium":String(result.risk_level).toLowerCase().includes("low")?"low":"") : "";
  return <div className="shell">
    <aside>
      <div className="brand"><div className="brandmark">B</div><div><strong>BuildWise AI</strong><small>CONSTRUCTION INTELLIGENCE</small></div></div>
      <div><div className="navlabel">Workspace</div><div className="nav">
        <button className="active" onClick={()=>document.getElementById("overview").scrollIntoView({behavior:"smooth"})}><span className="ico">▦</span>Overview</button>
        <button onClick={()=>document.getElementById("modules").scrollIntoView({behavior:"smooth"})}><span className="ico">✦</span>AI Modules</button>
        <button onClick={()=>document.getElementById("workbench").scrollIntoView({behavior:"smooth"})}><span className="ico">⌘</span>Workbench</button>
      </div></div>
      <div><div className="navlabel">Intelligence tools</div><div className="nav">
        {FEATURES.slice(0,3).map(f=><button key={f.id} className={feature===f.id?"active":""} onClick={()=>chooseFeature(f.id)}><span className="ico">{f.icon}</span>{f.title}</button>)}
      </div></div>
      <div className="sidefoot">AI-assisted decision support<br/>Always verify safety-critical decisions with qualified professionals.</div>
    </aside>
    <main>
      <header className="topbar"><div className="crumb">Workspace / <b>Overview</b></div><div className="profile"><div className="avatar">BW</div><span>Construction Project Workspace</span></div></header>
      <div className="content" id="overview">
        <div className="eyebrow">Multimodal construction intelligence</div>
        <h1>Plan smarter. Build safer.</h1>
        <p className="intro">An AI-powered decision-support workspace for site observations, construction planning, property estimates and weather-aware guidance. Add project context and an image when helpful.</p>
        <div className="hero"><div><h2>Welcome to BuildWise AI</h2><p>Turn field notes, site photos and project details into structured observations and practical next steps — powered by a hosted multimodal AI model.</p></div><div className="heroBadge">● &nbsp; {health?.gemini_configured ? "AI connection configured" : "AI key setup required"}</div></div>
        <div className="stats">
          <div className="stat"><div className="stathead"><span>AI modules</span><span>✦</span></div><div className="statnum">06</div><div className="statnote">Safety, cracks, planning and more</div></div>
          <div className="stat"><div className="stathead"><span>Local model memory</span><span>⌁</span></div><div className="statnum">0 GB</div><div className="statnote">Inference runs through hosted API</div></div>
          <div className="stat"><div className="stathead"><span>API status</span><span>◉</span></div><div className="statnum" style={{fontSize:20}}>{health?"Online":"Checking…"}</div><div className="statnote">{health?.model || "FastAPI service"}</div></div>
        </div>
        <div className="sectionhead" id="modules"><div><h2>Intelligence modules</h2><p>Choose a workflow to open its analysis form.</p></div></div>
        <div className="features">{FEATURES.map(f=><button key={f.id} className={"feature "+(feature===f.id?"selected":"")} onClick={()=>chooseFeature(f.id)}><div className="featureIcon">{f.icon}</div><h3>{f.title}</h3><p>{f.desc}</p></button>)}</div>
        <div className="sectionhead" id="workbench"><div><h2>Analysis workbench</h2><p>Describe the situation, add structured details and run an AI analysis.</p></div></div>
        <div className="workgrid">
          <form className="panel" onSubmit={runAnalysis}>
            <h3>{selected.title}</h3><p className="sub">Your inputs are sent to the backend and processed by the configured Gemini API.</p>
            <label>Question / description</label>
            <textarea value={prompt} onChange={e=>setPrompt(e.target.value)} placeholder="Describe the site, project or question..." />
            <label>Site or property image <span className="hint">(optional, max 8 MB)</span></label>
            <div className="filebox"><input type="file" accept="image/*" onChange={e=>setImage(e.target.files?.[0]||null)}/>{image&&<div className="hint">{image.name} · {(image.size/1024/1024).toFixed(2)} MB</div>}</div>
            <div className="sectionhead" style={{marginTop:22,marginBottom:0}}><div><h2 style={{fontSize:14}}>Project details</h2><p>Only fill fields relevant to your request.</p></div></div>
            <div className="two"><div><label>Location / city</label><input value={project.location} onChange={e=>update("location",e.target.value)} placeholder="e.g. Indore, MP"/></div><div><label>Current activity</label><input value={project.activity} onChange={e=>update("activity",e.target.value)} placeholder="e.g. slab casting"/></div></div>
            <div className="two"><div><label>Area / built-up size</label><input type="number" min="0" value={project.area} onChange={e=>update("area",e.target.value)} placeholder="e.g. 1200"/></div><div><label>Area unit</label><select value={project.unit} onChange={e=>update("unit",e.target.value)}><option>sq ft</option><option>sq m</option><option>sq yd</option></select></div></div>
            <div className="two"><div><label>Price per area unit (optional)</label><input type="number" min="0" value={project.pricePerUnit} onChange={e=>update("pricePerUnit",e.target.value)} placeholder="e.g. 4500"/></div><div><label>Budget (optional)</label><input value={project.budget} onChange={e=>update("budget",e.target.value)} placeholder="e.g. ₹25 lakh"/></div></div>
            <div className="two"><div><label>Target duration</label><input value={project.duration} onChange={e=>update("duration",e.target.value)} placeholder="e.g. 6 months"/></div><div><label>Materials / notes</label><input value={project.materials} onChange={e=>update("materials",e.target.value)} placeholder="e.g. RCC, brick, steel"/></div></div>
            {feature==="weather"&&<div className="resultsection"><h4>Weather forecast</h4><p className="sub">Default coordinates are for Indore, Madhya Pradesh. Change them for your site, then fetch the forecast.</p><div className="two"><div><label>Latitude</label><input value={coords.latitude} onChange={e=>setCoords({...coords,latitude:e.target.value})}/></div><div><label>Longitude</label><input value={coords.longitude} onChange={e=>setCoords({...coords,longitude:e.target.value})}/></div></div><button className="btn secondary" type="button" disabled={busy} onClick={getWeather}>Fetch forecast</button>{weather&&<div className="weatherbox"><strong>Current conditions</strong><br/>Temperature: {weather.current?.temperature_2m}°C · Feels like {weather.current?.apparent_temperature}°C<br/>Wind: {weather.current?.wind_speed_10m} km/h · Precipitation: {weather.current?.precipitation} mm<br/><strong>Forecast loaded</strong> — details will be included in the AI advisory.</div>}</div>}
            <button className="btn" type="submit" disabled={busy}>{busy?"Working…":"✦  Generate AI insights"}</button>
            {error&&<div className="error">{error}</div>}
            <div className="notice">Important: AI output is advisory only. It is not an engineering inspection, legal approval, official weather alert or certified property appraisal.</div>
          </form>
          <div className="panel">
            <h3>AI analysis report</h3><p className="sub">Structured results will appear here after you run an analysis.</p>
            {!result?<div className="resultEmpty"><div className="big">▤</div><strong>Ready when you are</strong><p>Select a module, enter the available context, and choose Generate AI insights.</p></div>:<div>
              <div className="resultTitle"><h3>{result.title}</h3><span className={"risk "+riskClass}>{result.risk_level||"Informational"}</span></div>
              <p className="summary">{result.summary}</p>
              {result.observations?.length>0&&<div className="resultsection"><h4>Observations</h4><ul>{result.observations.map((x,i)=><li key={i}>{x}</li>)}</ul></div>}
              {result.recommendations?.length>0&&<div className="resultsection"><h4>Recommended next steps</h4><ul>{result.recommendations.map((x,i)=><li key={i}>{x}</li>)}</ul></div>}
              {result.limitations?.length>0&&<div className="resultsection"><h4>Limitations & assumptions</h4><ul>{result.limitations.map((x,i)=><li key={i}>{x}</li>)}</ul></div>}
              {result.structured_data&&Object.keys(result.structured_data).length>0&&<div className="resultsection"><h4>Structured data</h4><pre style={{whiteSpace:"pre-wrap",fontSize:11,color:"#475569"}}>{JSON.stringify(result.structured_data,null,2)}</pre></div>}
              <button className="btn secondary" onClick={()=>{navigator.clipboard?.writeText(JSON.stringify(result,null,2));}}>Copy report JSON</button>
              <button className="btn secondary" onClick={()=>{setResult(null);setError("");}}>Clear report</button>
            </div>}
          </div>
        </div>
        <footer>BuildWise AI · React + FastAPI + hosted Gemini · Built for responsible construction decision support</footer>
      </div>
    </main>
  </div>
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
